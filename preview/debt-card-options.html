<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Finora — Debts, six ways</title>
<style>
/* ============================================================
   TOKENS — mirrored from src/styles/theme.css [data-theme="dark"]
   ============================================================ */
:root{
  --bg:#131A18; --surface:#181F1C; --surface-2:#202824; --surface-3:#2A332E;
  --ink:#F1F3EF; --muted:#94A59C; --muted-2:#647068;
  --primary:#3FB592; --primary-soft:rgba(63,181,146,.30); --primary-on:#0F1419;
  --accent:#B98438; --danger:#D26A5C; --danger-soft:rgba(210,106,92,.30); --danger-title:#E58774;
  --info:#2F75BC; --warn:#D9A234;
  --success:#3F8E5E; --success-soft:rgba(63,142,94,.40); --success-title:#5DBC83;
  --border:#27302C; --border-2:#1E2623; --divider:#343F3A;
  --shadow-card:0 1px 2px rgba(0,0,0,.18),0 8px 24px rgba(0,0,0,.32);
  --radius-card:12px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font);
  font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
  padding:32px 24px 100px;
}
.tabular{font-variant-numeric:tabular-nums}

.page-head{max-width:1240px;margin:0 auto 30px}
.page-head h1{font-size:24px;font-weight:600;letter-spacing:-.02em}
.page-head p{color:var(--muted);font-size:13.5px;margin-top:6px;max-width:92ch}
.page-head p b{color:var(--ink);font-weight:600}
.problems{margin-top:16px;display:grid;gap:8px}
.problem{
  display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;
  padding:11px 14px;border-radius:9px;background:var(--surface-2);
  border:1px solid var(--border);font-size:12.5px;color:var(--muted);line-height:1.55;
}
.problem .n{
  width:20px;height:20px;border-radius:6px;background:var(--danger-soft);
  color:var(--danger-title);font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}
.problem b{color:var(--ink);font-weight:600}

.option{
  max-width:1240px;margin:0 auto 26px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-card);overflow:hidden;
  box-shadow:var(--shadow-card);
}
.option-head{padding:15px 20px;border-bottom:1px solid var(--border);display:flex;gap:13px;align-items:flex-start}
.option-badge{
  flex:none;width:27px;height:27px;border-radius:8px;background:var(--primary);color:var(--primary-on);
  display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;
}
.option-title{font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.option-desc{font-size:12.5px;color:var(--muted);margin-top:3px;max-width:92ch}
.option-tags{margin-top:7px;display:flex;gap:6px;flex-wrap:wrap}
.tag{
  font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;
  border-radius:999px;font-weight:700;background:var(--surface-3);color:var(--muted);
}
.tag.good{background:var(--primary-soft);color:var(--primary)}
.tag.warn{background:var(--danger-soft);color:var(--danger-title)}
.tag.info{background:rgba(47,117,188,.24);color:#7FB2E4}

.card-body{padding:18px 20px 20px}
.notes{display:grid;gap:5px;margin-top:14px;padding-top:13px;border-top:1px solid var(--border-2);font-size:12px;color:var(--muted)}
.notes div{display:flex;gap:8px;align-items:flex-start}
.notes .k{flex:none;color:var(--ink);font-weight:600;min-width:92px}

.stack{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:1100px){ .stack{grid-template-columns:1fr 1fr} }

/* The counterparty pictogram, mirrored from the app's User icon. */
.user{
  width:38px;height:38px;border-radius:10px;flex:none;
  display:flex;align-items:center;justify-content:center;background:var(--surface-2);
}
.user svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ============================================================
   D1 — THE CERTIFICATE. A debt is a contract too, and the same
   bond shell the Investments screen uses reads just as well here:
   a perforated instrument, a serial, engraved terms, and the
   two figures — what you owe now, and what you owe in total.
   ============================================================ */
.d1{
  position:relative;overflow:hidden;
  border-radius:6px;padding:22px 22px 24px;
  background:linear-gradient(160deg,#1E2A24 0%,#22302A 55%,#1A241F 100%);
  border:1px solid var(--border);box-shadow:var(--shadow-card);
  font-family:var(--mono);
}
.d1::before,.d1::after{
  content:'';position:absolute;left:0;right:0;height:9px;pointer-events:none;z-index:1;
  background:
    radial-gradient(circle at 7px 4.5px, var(--bg) 3.4px, transparent 3.6px),
    radial-gradient(circle at 7px 4.5px, transparent 2.6px, rgba(0,0,0,.55) 3.4px, transparent 4.2px);
  background-size:14px 9px,14px 9px;
  background-position:0 0,0 0;
  background-repeat:repeat-x,repeat-x;
}
.d1::before{top:0}
.d1::after{bottom:0}
.d1 .head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.d1 .name{font-size:16px;font-weight:700;letter-spacing:.02em;color:var(--ink);line-height:1.25;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.d1 .serial{font-size:10px;color:var(--muted);letter-spacing:.12em;margin-top:4px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.d1 .seal{
  flex:none;width:56px;height:56px;border-radius:50%;
  border:2px solid var(--tone);color:var(--tone);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transform:rotate(-9deg);line-height:1;margin-right:6px;
}
.d1 .seal .p{font-size:15px;font-weight:700;letter-spacing:-.02em}
.d1 .seal .l{font-size:7.5px;letter-spacing:.14em;margin-top:3px}
.d1 .fields{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 16px;
  margin-top:16px;padding-top:14px;border-top:1px solid var(--border);
}
.d1 .fields .k{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.d1 .fields .v{font-size:14px;font-weight:700;color:var(--ink);margin-top:3px;font-variant-numeric:tabular-nums;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.d1 .ledger{margin-top:14px;padding-top:12px;border-top:1px dashed var(--divider)}
.d1 .ledger-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:7px}
.d1 .ledger-head .t{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.d1 .ledger-head .n{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.d1 .dline{
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:0 16px;align-items:baseline;
  padding:8px 0;border-bottom:1px solid var(--border-2);
}
.d1 .dline:last-child{border-bottom:0}
.d1 .dk{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.d1 .dd{font-size:12.5px;color:var(--ink);font-variant-numeric:tabular-nums;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.d1 .da{font-size:12.5px;font-weight:700;color:var(--tone);font-variant-numeric:tabular-nums;white-space:nowrap}
.d1 .tally{
  display:flex;align-items:center;gap:7px;margin-top:9px;padding:7px 10px;border-radius:4px;
  background:rgba(255,255,255,.04);font-size:10.5px;letter-spacing:.06em;color:var(--muted);
}
.d1 .tally .pip{flex:none;width:5px;height:5px;border-radius:50%;background:var(--tone)}
.d1 .tally b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.d1 .vals{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-top:14px}
.d1 .vals .k{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.d1 .vals .n{font-size:22px;font-weight:700;letter-spacing:-.03em;margin-top:3px;font-variant-numeric:tabular-nums}
.d1 .v--now .n{color:var(--tone)}
.d1 .v--tot .n{font-size:15px;color:var(--ink)}

/* ============================================================
   D2 — THE LEDGER CARD. The debt as a statement: ruled rows,
   one line per fact, with the running balance down the right.
   The polarity (I OWE / OWED TO ME) is the seal at the top.
   ============================================================ */
.d2{
  position:relative;overflow:hidden;
  border-radius:8px;padding:0;
  background:var(--surface-2);border:1px solid var(--border);
  box-shadow:var(--shadow-card);font-family:var(--mono);
}
.d2 .head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:15px 18px;border-bottom:1px dashed var(--divider);
}
.d2 .who{display:flex;align-items:center;gap:10px;min-width:0}
.d2 .who .nm{font-size:15px;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.d2 .stamp{
  flex:none;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  padding:3px 8px;border:2px solid var(--tone);color:var(--tone);border-radius:4px;transform:rotate(-5deg);
  white-space:nowrap;
}
.d2 .rows{padding:6px 18px 10px}
.d2 .row{
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  font-size:12px;color:var(--muted);padding:5px 0;
}
.d2 .row b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.d2 .row--total{border-top:1px dashed var(--divider);margin-top:6px;padding-top:9px;font-size:13px}
.d2 .row--total b{font-size:17px;color:var(--tone)}
.d2 .bar{height:4px;background:var(--surface-3);border-radius:999px;overflow:hidden;margin:2px 18px 14px}
.d2 .bar i{display:block;height:100%;background:var(--tone);border-radius:999px}
.d2 .foot{padding:0 18px 15px;font-size:10.5px;color:var(--muted)}

/* ============================================================
   D3 — THE WEIGHTED LEDGER. The debt as a scale: what you owe
   now against what you owe in total, drawn as a filled bar whose
   missing part IS the interest. One shape, one fact.
   ============================================================ */
.d3{
  position:relative;overflow:hidden;
  border-radius:12px;padding:18px 20px 20px;
  background:linear-gradient(160deg,#2A2320 0%,#242A26 55%,#1A241F 100%);
  border:1px solid var(--border);box-shadow:var(--shadow-card);
  font-family:var(--font);
}
.d3 .top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.d3 .who{display:flex;align-items:center;gap:10px;min-width:0}
.d3 .nm{font-size:16px;font-weight:700;letter-spacing:-.01em;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.d3 .sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.d3 .polar{
  flex:none;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  padding:4px 9px;border-radius:999px;background:var(--danger-soft);color:var(--danger-title);
}
.d3 .polar.in{background:var(--primary-soft);color:var(--primary)}
.d3 .figure{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-top:16px}
.d3 .figure .k{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.d3 .figure .n{font-size:26px;font-weight:800;letter-spacing:-.03em;margin-top:3px;
  font-variant-numeric:tabular-nums;color:var(--danger)}
.d3 .figure .n.in{color:var(--primary)}
.d3 .figure .of{font-size:11.5px;color:var(--muted);margin-top:4px}
.d3 .scale{margin-top:16px}
.d3 .track{position:relative;height:14px;border-radius:7px;background:var(--surface-3);overflow:hidden}
.d3 .track i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#8A3A2F,#D26A5C);border-radius:7px}
.d3 .track.in i{background:linear-gradient(90deg,#25654F,#3FB592)}
.d3 .track .interest{
  position:absolute;right:0;top:0;bottom:0;
  background:repeating-linear-gradient(45deg,rgba(217,162,52,.55) 0 5px,transparent 5px 10px);
}
.d3 .legend{display:flex;justify-content:space-between;gap:12px;margin-top:8px;font-size:10.5px;color:var(--muted)}
.d3 .legend span{display:flex;align-items:center;gap:6px}
.d3 .legend i{width:9px;height:9px;border-radius:2px;background:var(--danger);flex:none}
.d3 .legend .int i{background:var(--warn)}
.d3 .legend b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.d3 .act{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:13px;border-top:1px solid var(--border-2)}
.d3 .pay{
  margin-left:auto;display:inline-flex;align-items:center;gap:7px;border:0;cursor:pointer;
  border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:700;color:#fff;
  background:color-mix(in srgb,var(--danger) 65%,black);
}
.d3 .pay.in{background:color-mix(in srgb,var(--primary) 65%,black)}
.d3 .pay .dot{width:6px;height:6px;border-radius:50%;background:#fff}

/* ============================================================
   D4 — THE SLIP. A debt as a payment slip / promissory note:
   a ruled document with a perforated tear line, the amount in
   a heavy figure, and the terms in a stamp at the corner.
   ============================================================ */
.d4{
  position:relative;overflow:hidden;
  border-radius:4px;padding:0;
  background:linear-gradient(180deg,#232B27,#1B2320);
  border:1px solid var(--border);box-shadow:var(--shadow-card);
  font-family:var(--mono);
}
.d4 .tear{
  height:9px;
  background:radial-gradient(circle at 7px 4.5px,var(--bg) 3.4px,transparent 3.6px) 0 0/14px 9px repeat-x;
}
.d4 .body{padding:18px 22px 20px}
.d4 .head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.d4 .kicker{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.d4 .name{font-size:17px;font-weight:700;color:var(--ink);margin-top:5px;line-height:1.2}
.d4 .corner{
  flex:none;text-align:right;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  line-height:1.7;
}
.d4 .corner b{display:block;color:var(--tone);font-size:11px;letter-spacing:.12em}
.d4 .amount{
  margin-top:18px;padding-top:16px;border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);padding-bottom:16px;
}
.d4 .amount .k{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.d4 .amount .n{font-size:30px;font-weight:700;letter-spacing:-.03em;margin-top:4px;
  font-variant-numeric:tabular-nums;color:var(--tone)}
.d4 .amount .of{font-size:11.5px;color:var(--muted);margin-top:5px}
.d4 .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 16px;margin-top:16px}
.d4 .grid .k{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.d4 .grid .v{font-size:13.5px;font-weight:700;color:var(--ink);margin-top:3px;font-variant-numeric:tabular-nums}
.d4 .rule{border-top:1px dashed var(--divider);margin:15px 0 12px}
.d4 .rows .row{
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  font-size:11.5px;color:var(--muted);padding:3px 0;
}
.d4 .rows .row b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.d4 .sign{
  margin-top:16px;display:flex;align-items:flex-end;justify-content:space-between;gap:14px;
  padding-top:12px;border-top:1px solid var(--border-2);
}
.d4 .sig{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-2)}
.d4 .sigline{width:120px;border-bottom:1px solid var(--divider);height:1px}

/* ============================================================
   D5 — THE ARROW. The debt as a direction: money flowing OUT
   (you owe) or IN (owed to you), with the outstanding as the
   size of the flow. The polarity becomes the picture.
   ============================================================ */
.d5{
  position:relative;overflow:hidden;
  border-radius:12px;padding:18px 20px 20px;
  background:var(--surface-2);border:1px solid var(--border);box-shadow:var(--shadow-card);
}
.d5 .head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.d5 .who{display:flex;align-items:center;gap:10px;min-width:0}
.d5 .nm{font-size:15.5px;font-weight:700;letter-spacing:-.01em;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.d5 .sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.d5 .flow{
  display:flex;align-items:center;gap:12px;margin-top:16px;
  padding:14px 16px;border-radius:10px;background:rgba(255,255,255,.03);
}
.d5 .flow .arrow{
  flex:none;width:46px;height:46px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--danger-soft);color:var(--danger-title);
}
.d5 .flow.in .arrow{background:var(--primary-soft);color:var(--primary)}
.d5 .flow .arrow svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.4;
  stroke-linecap:round;stroke-linejoin:round}
.d5 .flow .k{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.d5 .flow .n{font-size:24px;font-weight:800;letter-spacing:-.03em;margin-top:2px;
  font-variant-numeric:tabular-nums;color:var(--danger)}
.d5 .flow.in .n{color:var(--primary)}
.d5 .split{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.d5 .split > div{padding:11px 13px;border-radius:8px;background:rgba(255,255,255,.03)}
.d5 .split .k{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.d5 .split .n{font-size:15px;font-weight:700;color:var(--ink);margin-top:4px;font-variant-numeric:tabular-nums}
.d5 .pay{
  margin-top:14px;width:100%;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  border:0;cursor:pointer;border-radius:9px;padding:10px;font-size:13px;font-weight:700;color:#fff;
  background:color-mix(in srgb,var(--danger) 65%,black);
}
.d5 .pay.in{background:color-mix(in srgb,var(--primary) 65%,black)}
.d5 .pay .dot{width:6px;height:6px;border-radius:50%;background:#fff}

/* ============================================================
   D6 — THE CERTIFICATE, DEBT EDITION. The same bond shell as
   the Investments screen, but a debt is a NOTE, not a bond: the
   perforation runs down the LEFT edge (a tear-off stub), the
   seal carries the APR, and the footer names the two figures a
   debtor cares about — what's left, and what interest it cost.
   ============================================================ */
.d6{
  position:relative;overflow:hidden;
  border-radius:6px;padding:22px 22px 24px 34px;
  background:linear-gradient(160deg,#1E2A24 0%,#22302A 55%,#1A241F 100%);
  border:1px solid var(--border);box-shadow:var(--shadow-card);
  font-family:var(--mono);
}
/* The tear-off stub — the perforation runs DOWN the left edge. */
.d6::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:11px;pointer-events:none;z-index:1;
  background:
    radial-gradient(circle at 5.5px 7px, var(--bg) 3.4px, transparent 3.6px),
    radial-gradient(circle at 5.5px 7px, transparent 2.6px, rgba(0,0,0,.55) 3.4px, transparent 4.2px);
  background-size:11px 14px,11px 14px;
  background-repeat:repeat-y;
}
.d6 .head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.d6 .name{font-size:16px;font-weight:700;letter-spacing:.02em;color:var(--ink);line-height:1.25;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.d6 .serial{font-size:10px;color:var(--muted);letter-spacing:.12em;margin-top:4px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.d6 .seal{
  flex:none;width:56px;height:56px;border-radius:50%;
  border:2px solid var(--tone);color:var(--tone);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transform:rotate(-9deg);line-height:1;margin-right:6px;
}
.d6 .seal .p{font-size:15px;font-weight:700;letter-spacing:-.02em}
.d6 .seal .l{font-size:7.5px;letter-spacing:.14em;margin-top:3px}
.d6 .fields{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 16px;
  margin-top:16px;padding-top:14px;border-top:1px solid var(--border);
}
.d6 .fields .k{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.d6 .fields .v{font-size:14px;font-weight:700;color:var(--ink);margin-top:3px;font-variant-numeric:tabular-nums;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.d6 .vals{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-top:16px;
  padding-top:14px;border-top:1px dashed var(--divider)}
.d6 .vals .k{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.d6 .vals .n{font-size:22px;font-weight:700;letter-spacing:-.03em;margin-top:3px;font-variant-numeric:tabular-nums}
.d6 .v--now .n{color:var(--tone)}
.d6 .v--int .n{font-size:15px;color:var(--ink)}
.d6 .grow{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--primary)}
.d6 .grow .gk{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.d6 .grow .gn{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.d6 .tally{
  display:flex;align-items:center;gap:7px;margin-top:12px;padding:7px 10px;border-radius:4px;
  background:rgba(255,255,255,.04);font-size:10.5px;letter-spacing:.06em;color:var(--muted);
}
.d6 .tally .pip{flex:none;width:5px;height:5px;border-radius:50%;background:var(--tone)}
.d6 .tally b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div id="root"></div>

<script>
/* ============================================================
   DATA — the real shapes the Debts screen renders.
   ============================================================ */
const fmt = n => '৳ ' + Math.round(Math.abs(n)).toLocaleString('en-IN');
const MIDDOT = '·';

const DEBTS = [
  {
    id:'d-flat-owe', name:'Rahim', direction:'i_owe', kind:'flat',
    total: 1226361, paid: 100, person:'Rahim',
    rate: 0, term: 0, dueDate:'', lastPaid:'', payLabel:'Pay now',
  },
  {
    id:'d-loan-owe', name:'City Bank Loan', direction:'i_owe', kind:'loan',
    total: 87418, paid: 52450, person:'', rate: 9, term: 12,
    emi: 8742, interestPaid: 4200, principalPaid: 48250, lastPaid:'12 Nov 2026',
    dueDate:'26 Dec 2026', payLabel:'Pay now',
  },
  {
    id:'d-owe-me', name:'Ayesha', direction:'owed_to_me', kind:'flat',
    total: 45000, paid: 20000, person:'Ayesha',
    rate: 0, term: 0, dueDate:'', lastPaid:'04 Oct 2026', payLabel:'Receive now',
  },
];

const toneOf = d => d.direction === 'i_owe' ? 'var(--danger)' : 'var(--primary)';
const softOf = d => d.direction === 'i_owe' ? 'var(--danger-soft)' : 'var(--primary-soft)';
const inkOf = d => d.direction === 'i_owe' ? 'var(--danger-title)' : 'var(--primary)';

const userIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg>';
const arrowOut = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
const arrowIn  = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>';

const outstandingOf = d => d.kind === 'loan'
  ? Math.max(0, d.total - d.principalPaid)
  : Math.max(0, d.total - d.paid);

const pctOf = d => d.total > 0
  ? Math.min(100, Math.round((d.kind === 'loan' ? d.principalPaid : d.paid) / d.total * 100))
  : 0;

const serialFor = id => {
  let h = 0;
  for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) % 999999;
  return String(h).padStart(6, '0');
};

/* ============================================================
   D1 — THE CERTIFICATE
   ============================================================ */
function d1(d){
  const out = outstandingOf(d);
  const pct = pctOf(d);
  const isLoan = d.kind === 'loan';
  return `
  <div class="d1" style="--tone:${toneOf(d)}">
    <div class="head">
      <div style="min-width:0">
        <div class="name">${d.name}</div>
        <div class="serial">NO. ${serialFor(d.id)} ${MIDDOT} ${isLoan ? 'LOAN' : 'FLAT'} ${MIDDOT} ${d.direction === 'i_owe' ? 'I OWE' : 'OWED TO ME'}</div>
      </div>
      <div class="seal">
        <span class="p">${isLoan ? d.rate + '%' : '—'}</span>
        <span class="l">${isLoan ? 'APR' : 'FLAT'}</span>
      </div>
    </div>

    <div class="fields">
      <div><div class="k">Total</div><div class="v">${fmt(d.total)}</div></div>
      <div><div class="k">${isLoan ? 'Term' : 'Person'}</div><div class="v">${isLoan ? d.term + ' mo' : (d.person || '—')}</div></div>
      <div><div class="k">Paid</div><div class="v">${pct}%</div></div>
    </div>

    <div class="ledger">
      <div class="ledger-head">
        <span class="t">${isLoan ? 'Payments' : 'Repayment'}</span>
        <span class="n">${isLoan ? 'EMI ' + fmt(d.emi) : 'No schedule'}</span>
      </div>
      <div class="dline">
        <span class="dk">Last paid</span>
        <span class="dd">${d.lastPaid || '—'}</span>
        <span class="da">${fmt(isLoan ? d.principalPaid + d.interestPaid : d.paid)}</span>
      </div>
      <div class="dline">
        <span class="dk">${isLoan ? 'Next due' : 'Due'}</span>
        <span class="dd">${d.dueDate || '—'}</span>
        <span class="da">${fmt(isLoan ? d.emi : out)}</span>
      </div>
      <div class="tally">
        <span class="pip"></span>
        <span>
          <b>${fmt(d.paid)}</b> paid of <b>${fmt(d.total)}</b> total
          ${isLoan ? ` ${MIDDOT} <b>${fmt(d.interestPaid)}</b> of it interest` : ''}
        </span>
      </div>
    </div>

    <div class="vals">
      <div class="v--now"><div class="k">Remaining</div><div class="n">${fmt(out)}</div></div>
      <div class="v--tot"><div class="k">Of total</div><div class="n">${fmt(d.total)}</div></div>
    </div>
  </div>`;
}

/* ============================================================
   D2 — THE LEDGER CARD
   ============================================================ */
function d2(d){
  const out = outstandingOf(d);
  const pct = pctOf(d);
  const isLoan = d.kind === 'loan';
  return `
  <div class="d2" style="--tone:${toneOf(d)}">
    <div class="head">
      <div class="who">
        <span class="user" style="color:${inkOf(d)}">${userIcon}</span>
        <span class="nm">${d.name}</span>
      </div>
      <span class="stamp">${d.direction === 'i_owe' ? 'I Owe' : 'Owed to me'}</span>
    </div>
    <div class="rows">
      ${isLoan ? `
      <div class="row"><span>Monthly EMI</span><b>${fmt(d.emi)}</b></div>
      <div class="row"><span>Interest paid so far</span><b>${fmt(d.interestPaid)}</b></div>
      <div class="row"><span>Principal repaid</span><b>${fmt(d.principalPaid)}</b></div>
      ` : `
      <div class="row"><span>Total</span><b>${fmt(d.total)}</b></div>
      <div class="row"><span>Paid so far</span><b>${fmt(d.paid)}</b></div>
      <div class="row"><span>Last payment</span><b>${d.lastPaid || '—'}</b></div>
      `}
      <div class="row row--total"><span>Remaining</span><b>${fmt(out)}</b></div>
    </div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="foot">${pct}% paid ${MIDDOT} ${d.direction === 'i_owe' ? 'you are the payer' : 'they are the payer'}</div>
  </div>`;
}

/* ============================================================
   D3 — THE WEIGHTED LEDGER
   ============================================================ */
function d3(d){
  const out = outstandingOf(d);
  const pct = pctOf(d);
  const paid = d.total - out;
  const isOwe = d.direction === 'i_owe';
  return `
  <div class="d3" style="--tone:${toneOf(d)}">
    <div class="top">
      <div class="who">
        <span class="user" style="color:${inkOf(d)}">${userIcon}</span>
        <div style="min-width:0">
          <div class="nm">${d.name}</div>
          <div class="sub">${d.person ? d.person + ' ' + MIDDOT + ' ' : ''}${d.kind === 'loan' ? d.rate + '% APR ' + MIDDOT + ' ' + d.term + ' months' : 'No interest'}</div>
        </div>
      </div>
      <span class="polar ${isOwe ? '' : 'in'}">${isOwe ? 'I Owe' : 'Owed to me'}</span>
    </div>

    <div class="figure">
      <div>
        <div class="k">Remaining</div>
        <div class="n ${isOwe ? '' : 'in'}">${fmt(out)}</div>
        <div class="of">of ${fmt(d.total)} total</div>
      </div>
      <div style="text-align:right">
        <div class="k">Paid</div>
        <div class="n" style="font-size:18px;color:var(--ink)">${pct}%</div>
        <div class="of">${fmt(paid)}</div>
      </div>
    </div>

    <div class="scale">
      <div class="track ${isOwe ? '' : 'in'}">
        <i style="width:${pct}%"></i>
        ${d.kind === 'loan' ? `<span class="interest" style="width:${Math.max(0, 100 - pct - (d.interestPaid / d.total * 100))}%"></span>` : ''}
      </div>
      <div class="legend">
        <span><i></i>Paid <b>${fmt(paid)}</b></span>
        ${d.kind === 'loan' ? `<span class="int"><i></i>Interest <b>${fmt(d.interestPaid)}</b></span>` : ''}
        <span>Remaining <b>${fmt(out)}</b></span>
      </div>
    </div>

    <div class="act">
      <span style="font-size:11.5px;color:var(--muted)">${d.kind === 'loan' ? 'Next EMI ' + fmt(d.emi) : 'No schedule'}</span>
      <button class="pay ${isOwe ? '' : 'in'}"><span class="dot"></span>${d.payLabel}</button>
    </div>
  </div>`;
}

/* ============================================================
   D4 — THE SLIP
   ============================================================ */
function d4(d){
  const out = outstandingOf(d);
  const pct = pctOf(d);
  const isLoan = d.kind === 'loan';
  return `
  <div class="d4" style="--tone:${toneOf(d)}">
    <div class="tear"></div>
    <div class="body">
      <div class="head">
        <div style="min-width:0">
          <div class="kicker">${d.direction === 'i_owe' ? 'Promissory note' : 'Receipt for money lent'}</div>
          <div class="name">${d.name}</div>
        </div>
        <div class="corner">
          No. ${serialFor(d.id)}
          <b>${d.direction === 'i_owe' ? 'I Owe' : 'Owed to me'}</b>
          ${d.dueDate ? 'Due ' + d.dueDate : ''}
        </div>
      </div>

      <div class="amount">
        <div class="k">Amount outstanding</div>
        <div class="n">${fmt(out)}</div>
        <div class="of">of ${fmt(d.total)} original ${MIDDOT} ${pct}% settled</div>
      </div>

      <div class="grid">
        <div><div class="k">Total</div><div class="v">${fmt(d.total)}</div></div>
        <div><div class="k">Paid</div><div class="v">${fmt(d.kind === 'loan' ? d.principalPaid : d.paid)}</div></div>
        <div><div class="k">${isLoan ? 'APR' : 'Interest'}</div><div class="v">${isLoan ? d.rate + '%' : 'None'}</div></div>
      </div>

      <div class="rule"></div>

      <div class="rows">
        <div class="row"><span>${isLoan ? 'Monthly payment' : 'Repayment method'}</span><b>${isLoan ? fmt(d.emi) : 'As agreed'}</b></div>
        <div class="row"><span>${isLoan ? 'Interest paid so far' : 'Last payment'}</span><b>${isLoan ? fmt(d.interestPaid) : (d.lastPaid || '—')}</b></div>
        <div class="row"><span>${isLoan ? 'Term' : 'Counterparty'}</span><b>${isLoan ? d.term + ' months' : (d.person || '—')}</b></div>
      </div>

      <div class="sign">
        <div>
          <div class="sig">Signature</div>
          <div class="sigline"></div>
        </div>
        <div style="text-align:right">
          <div class="sig">Settled</div>
          <div class="sigline"></div>
        </div>
      </div>
    </div>
  </div>`;
}

/* ============================================================
   D5 — THE ARROW
   ============================================================ */
function d5(d){
  const out = outstandingOf(d);
  const pct = pctOf(d);
  const isOwe = d.direction === 'i_owe';
  return `
  <div class="d5">
    <div class="head">
      <div class="who">
        <span class="user" style="color:${inkOf(d)}">${userIcon}</span>
        <div style="min-width:0">
          <div class="nm">${d.name}</div>
          <div class="sub">${d.kind === 'loan' ? d.rate + '% APR ' + MIDDOT + ' ' + d.term + ' months' : (d.person || 'Personal debt')}</div>
        </div>
      </div>
    </div>

    <div class="flow ${isOwe ? '' : 'in'}">
      <span class="arrow">${isOwe ? arrowOut : arrowIn}</span>
      <div>
        <div class="k">${isOwe ? 'Money out — you owe' : 'Money in — owed to you'}</div>
        <div class="n">${fmt(out)}</div>
      </div>
    </div>

    <div class="split">
      <div>
        <div class="k">Total</div>
        <div class="n">${fmt(d.total)}</div>
      </div>
      <div>
        <div class="k">${d.kind === 'loan' ? 'Interest paid' : 'Paid so far'}</div>
        <div class="n">${fmt(d.kind === 'loan' ? d.interestPaid : d.paid)}</div>
      </div>
    </div>

    <button class="pay ${isOwe ? '' : 'in'}"><span class="dot"></span>${d.payLabel}</button>
  </div>`;
}

/* ============================================================
   D6 — THE CERTIFICATE, DEBT EDITION
   ============================================================ */
function d6(d){
  const out = outstandingOf(d);
  const pct = pctOf(d);
  const isLoan = d.kind === 'loan';
  const interestCost = d.kind === 'loan' ? d.interestPaid : 0;
  return `
  <div class="d6" style="--tone:${toneOf(d)}">
    <div class="head">
      <div style="min-width:0">
        <div class="name">${d.name}</div>
        <div class="serial">NO. ${serialFor(d.id)} ${MIDDOT} ${isLoan ? 'LOAN NOTE' : 'I OWE NOTE'} ${MIDDOT} ${d.direction === 'i_owe' ? 'I OWE' : 'OWED TO ME'}</div>
      </div>
      <div class="seal">
        <span class="p">${isLoan ? d.rate + '%' : '0%'}</span>
        <span class="l">${isLoan ? 'APR' : 'INTEREST'}</span>
      </div>
    </div>

    <div class="fields">
      <div><div class="k">Total</div><div class="v">${fmt(d.total)}</div></div>
      <div><div class="k">Term</div><div class="v">${isLoan ? d.term + ' mo' : 'Open'}</div></div>
      <div><div class="k">Settled</div><div class="v">${pct}%</div></div>
    </div>

    <div class="tally">
      <span class="pip"></span>
      <span>
        <b>${fmt(d.kind === 'loan' ? d.principalPaid : d.paid)}</b> principal repaid
        ${isLoan ? ` ${MIDDOT} <b>${fmt(d.interestPaid)}</b> interest paid` : ''}
      </span>
    </div>

    <div class="vals">
      <div class="v--now"><div class="k">Remaining</div><div class="n">${fmt(out)}</div></div>
      <div class="grow">
        <div class="gk">${isLoan ? 'Interest cost' : 'Interest'}</div>
        <div class="gn">${fmt(interestCost)}</div>
      </div>
      <div class="v--int"><div class="k">Of total</div><div class="n">${fmt(d.total)}</div></div>
    </div>
  </div>`;
}

const VARIANTS = [
  {
    id:'d1', badge:'D1', render:d1,
    title:'The certificate',
    desc:'The same bond shell the Investments screen uses, applied to a debt: a perforated instrument, a serial, engraved terms, and a two-line ledger. A debt is a contract too, so it should read like one.',
    tags:[['good','Matches the investments'],['good','Serial + seal'],['good','Two-line ledger'],['info','Monospace']],
    notes:[
      ['Reads as','A debt certificate. Same family as the investment card, so the app has one document language.'],
      ['Honesty','Every figure is the real one: the total, the settled share, the last payment, the next due amount.'],
      ['Trade-off','A flat debt has no schedule, so its second ledger line is thin — the shape is shared, the content is not.'],
    ],
  },
  {
    id:'d2', badge:'D2', render:d2,
    title:'The ledger card',
    desc:'A statement of account: ruled rows, one line per fact, the running figure as the total. The polarity is a tilted stamp in the header, so who owes whom is settled before you read a number.',
    tags:[['good','One fact per row'],['good','Stamp states polarity'],['good','Flat and loan both fit'],['good','Shortest card']],
    notes:[
      ['Reads as','A bank statement. You read it top to bottom, one row at a time.'],
      ['Trade-off','The progress bar at the bottom is a separate element from the rows — the card has two structures, not one.'],
    ],
  },
  {
    id:'d3', badge:'D3', render:d3,
    title:'The weighted ledger',
    desc:'One bar carries the whole debt: the filled part is what you have settled, the empty part is what is left, and the hatched slice is the interest the loan has already cost you. The shape IS the story.',
    tags:[['good','Interest is visible'],['good','One shape, one fact'],['good','Polarity as a chip'],['good','Pay action inside']],
    notes:[
      ['Reads as','A gauge that fills as you pay. The hatched wedge is interest — money that never reduced the debt.'],
      ['Honesty','The bar segments are the real figures: settled share, interest share, remainder.'],
      ['Trade-off','The hatched interest slice needs a loan to be meaningful; on a flat debt the card is simpler than it looks.'],
    ],
  },
  {
    id:'d4', badge:'D4', render:d4,
    title:'The slip',
    desc:'A promissory note: a ruled document with a tear line, the outstanding in one heavy figure, the terms in the corner, and signature lines at the foot. It is the one variant that treats a debt as something SIGNED.',
    tags:[['good','Very document-like'],['good','Tear line'],['good','Signature lines'],['warn','Most theatrical']],
    notes:[
      ['Reads as','A promissory note. A debt is an obligation in writing, and this says so without a word.'],
      ['Trade-off','The signature lines are decoration — nothing is signed in the app — and the card is the tallest of the set.'],
    ],
  },
  {
    id:'d5', badge:'D5', render:d5,
    title:'The arrow',
    desc:'The debt as direction: a big arrow saying whether money is going OUT to the other party or coming IN. Polarity becomes the picture rather than a word, and the outstanding is the size of the flow.',
    tags:[['good','Polarity is the shape'],['good','Very scannable'],['good','Big pay action'],['info','Simple, less detail']],
    notes:[
      ['Reads as','A flow of money. Red arrow out, green arrow in — the polarity lands before the number does.'],
      ['Trade-off','The least information of the six: no serial, no schedule, no last payment.'],
    ],
  },
  {
    id:'d6', badge:'D6', render:d6,
    title:'The certificate, debt edition',
    desc:'The bond shell turned on its side: the perforation runs DOWN the left edge as a tear-off stub, the seal carries the APR, and the footer names the two figures a debtor cares about — what is left, and what the interest has cost.',
    tags:[['good','Tear-off stub'],['good','Interest cost named'],['good','Distinct from the bond'],['info','Left perforation']],
    notes:[
      ['Reads as','A tear-off note stub. You could detach it and keep the record.'],
      ['Trade-off','The left-edge perforation is the same trick as the bond, so the two cards share a visual trick as well as a shell.'],
    ],
  },
];

document.getElementById('root').innerHTML = `
  <div class="page-head">
    <h1>Debts — six ways</h1>
    <p>
      The Debts screen today is a horizontal split: identity and terms on the left, the headline
      amount on the right, and a progress strip underneath. It works, but it says nothing about what
      a debt <b>is</b> — a signed obligation with a direction, a schedule and an interest cost —
      and it borrows the same layout the investment card already overused.
      <br /><br />
      Six directions below. <b>D1</b> and <b>D6</b> extend the certificate language the Investments
      screen now speaks; <b>D2</b>–<b>D5</b> try shapes the debts screen has never used.
      All six render the same three real debts — a flat debt you owe, a loan you owe, and a debt
      owed to you.
    </p>
  </div>
  ${VARIANTS.map(v => `
  <div class="option" data-variant="${v.id}">
    <div class="option-head">
      <div class="option-badge">${v.badge}</div>
      <div>
        <div class="option-title">${v.title}</div>
        <div class="option-desc">${v.desc}</div>
        <div class="option-tags">${v.tags.map(([k,t]) => `<span class="tag ${k}">${t}</span>`).join('')}</div>
      </div>
    </div>
    <div class="card-body">
      <div class="stack">
        ${DEBTS.map(d => v.render(d)).join('')}
      </div>
      <div class="notes">
        ${v.notes.map(([k,t]) => `<div><span class="k">${k}</span><span>${t}</span></div>`).join('')}
      </div>
    </div>
  </div>`).join('')}
`;
</script>
</body>
</html>
