<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quick Add · mobile — Finora</title>
<meta name="viewport" content="width=device-width,initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="design-system.css">
<style>
  body { background: var(--surface-2); }
  .phone {
    max-width: 420px; margin: 24px auto; background: var(--surface);
    border-radius: 24px; border: 1px solid var(--line);
    padding: 16px; min-height: 720px; display: flex; flex-direction: column;
  }
  .numpad {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px;
  }
  .numpad button {
    height: 64px; min-height: 56px; font-size: 22px; font-weight: 500;
    border: 1px solid var(--line); background: var(--surface);
    border-radius: var(--r-sm); cursor: pointer; font-family: var(--mono);
    color: var(--ink);
  }
  .numpad button:hover { background: var(--surface-2); }
  .numpad button:active { background: var(--surface-2); }
  .numpad .accent { background: var(--accent); color: #fff; border-color: var(--accent); }
  .display {
    flex: 1; display: flex; flex-direction: column; justify-content: flex-end;
    text-align: right; padding: 16px; min-height: 160px;
  }
  .chip-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .close-btn {
    min-height: 44px; min-width: 44px;
    display: inline-flex; align-items: center; justify-content: center;
    padding: 8px 12px;
  }
</style>
</head>
<body>

<div class="phone">
  <div class="flex between items-center" style="padding: 8px 4px;">
    <div><strong>Quick add</strong></div>
    <button class="btn ghost close-btn" aria-label="Close quick add" onclick="history.back()">✕</button>
  </div>

  <div class="chip-row mt-3" role="tablist" aria-label="Transaction type">
    <button class="btn sm" aria-pressed="true" data-type="expense" onclick="setType('expense', this)">Expense</button>
    <button class="btn sm" aria-pressed="false" data-type="income" onclick="setType('income', this)">Income</button>
    <button class="btn sm" aria-pressed="false" data-type="transfer" onclick="setType('transfer', this)">Transfer</button>
    <button class="btn sm" aria-pressed="false" data-type="save" onclick="setType('save', this)">Save</button>
  </div>

  <div class="display">
    <div class="tiny muted" id="type-help">Decreases your balance.</div>
    <div class="hero-num mono mt-3" id="amount" aria-live="polite"><span class="cur">BDT</span>0</div>
  </div>

  <div class="numpad" role="group" aria-label="Numpad">
    <button aria-label="1" onclick="press('1')">1</button>
    <button aria-label="2" onclick="press('2')">2</button>
    <button aria-label="3" onclick="press('3')">3</button>
    <button aria-label="4" onclick="press('4')">4</button>
    <button aria-label="5" onclick="press('5')">5</button>
    <button aria-label="6" onclick="press('6')">6</button>
    <button aria-label="7" onclick="press('7')">7</button>
    <button aria-label="8" onclick="press('8')">8</button>
    <button aria-label="9" onclick="press('9')">9</button>
    <button aria-label="Decimal point (not used in this app)" onclick="press('.')">.</button>
    <button aria-label="0" onclick="press('0')">0</button>
    <button aria-label="Backspace" onclick="backspace()">⌫</button>
    <button style="grid-column: 1 / -1; height:56px; min-height:56px" class="accent" onclick="save()">Save expense</button>
  </div>

  <div class="grid-12 mt-4">
    <div class="col-6 field">
      <label for="qa-account">Account</label>
      <select id="qa-account" class="input"><option>City Bank</option><option>Cash</option></select>
    </div>
    <div class="col-6 field">
      <label for="qa-cat">Category</label>
      <select id="qa-cat" class="input"><option>Food</option><option>Transport</option><option>Shopping</option></select>
    </div>
  </div>
</div>

<div class="theme-toggle"><button class="btn" onclick="toggleTheme()">◐</button></div>
<script src="app.js"></script>
<script>
  let value = '';
  const help = {
    expense: 'Decreases your balance.',
    income:  'Increases your balance.',
    transfer:'Moves money between accounts.',
    save:    'Recorded as actual savings.'
  };
  function press(c) {
    if (c === '.' && value.includes('.')) return;
    value += c;
    document.getElementById('amount').innerHTML = '<span class="cur">BDT</span>' + (parseFloat(value || 0)).toLocaleString('en-IN');
  }
  function backspace() {
    value = value.slice(0, -1);
    document.getElementById('amount').innerHTML = '<span class="cur">BDT</span>' + (parseFloat(value || 0)).toLocaleString('en-IN');
  }
  function setType(t, btn) {
    document.querySelectorAll('.chip-row [aria-pressed]').forEach(b => b.setAttribute('aria-pressed', 'false'));
    btn.setAttribute('aria-pressed', 'true');
    document.getElementById('type-help').textContent = help[t];
    document.querySelector('.numpad .accent').textContent = 'Save ' + t;
  }
  function save() {
    if (!value || parseFloat(value) === 0) {
      toast('Enter an amount first.', 'bad');
      return;
    }
    toast('Saved BDT ' + parseFloat(value).toLocaleString('en-IN'), 'good');
    value = '';
    document.getElementById('amount').innerHTML = '<span class="cur">BDT</span>0';
  }
</script>
</body>
</html>
